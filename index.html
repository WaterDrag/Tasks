<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Úkoly</title>
<style>
  :root { --bg:#000; --card:#1c1c1e; --accent:#ffb300; --text:#fff; --sub:#e0e0e0; --dim:#8e8e93; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px 12px 120px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:8px 10px 4px; }
  h1 { font-size:34px; font-weight:400; margin:0; }
  .who { color:var(--dim); font-size:13px; text-align:right; }
  .who button { margin-left:8px; }
  .status { color:var(--dim); font-size:13px; padding:0 10px 14px; min-height:22px; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  .link { color:var(--accent); font-size:13px; }
  .card { background:var(--card); border-radius:18px; margin-bottom:10px; padding:4px 0 6px; }
  .row { display:flex; align-items:center; gap:10px; padding:4px 10px; min-height:48px; }
  .sub { padding-left:42px; min-height:40px; }
  .box { flex:none; width:22px; height:22px; border:2px solid var(--dim); border-radius:6px; display:grid; place-items:center; }
  .box.on { background:var(--accent); border-color:var(--accent); }
  .box.on::after { content:""; width:5px; height:10px; border:solid #000; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
  .sub .box { width:18px; height:18px; border-radius:5px; }
  .sub .box.on::after { width:4px; height:8px; }
  input.t { flex:1; min-width:0; background:none; border:0; outline:0; color:inherit; font:inherit; padding:10px 0; }
  input.t.main { font-weight:700; }
  .sub input.t { font-size:15px; color:var(--sub); padding:7px 0; }
  .done input.t { text-decoration:line-through; opacity:.5; }
  .count { color:var(--dim); font-size:13px; }
  .x { color:var(--dim); font-size:20px; padding:4px 8px; opacity:.6; }
  .x:hover { opacity:1; color:#ff6b6b; }
  .arrow { color:var(--dim); font-size:12px; padding:6px; }
  .add { display:flex; gap:8px; margin:6px 0 18px; }
  .add input { flex:1; background:var(--card); border:1px solid #2c2c2e; border-radius:14px; color:inherit; font:inherit; padding:12px 14px; outline:0; }
  .add input:focus { border-color:var(--accent); }
  .add button { background:var(--accent); color:#000; border-radius:14px; padding:0 18px; font-weight:700; }
  .addsub { padding:2px 10px 2px 42px; }
  .addsub input { width:100%; background:none; border:0; outline:0; color:var(--accent); font:inherit; font-size:14px; padding:8px 0; }
  .addsub input::placeholder { color:var(--accent); opacity:.7; }
  .doneh { color:var(--dim); font-size:14px; padding:12px 10px 8px; cursor:pointer; user-select:none; }
  .empty { text-align:center; color:var(--dim); padding:50px 0; }
  .login { text-align:center; padding:80px 0; }
  .login button { background:var(--accent); color:#000; font-weight:700; border-radius:14px; padding:14px 26px; margin-top:18px; }
  .err { color:#ff6b6b; font-size:14px; margin-top:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Úkoly</h1>
    <div class="who" id="who" hidden><span id="email"></span><button class="link" id="out">Odhlásit</button></div>
  </header>
  <div class="status" id="status"></div>

  <section id="login" class="login" hidden>
    <div>Přihlas se stejným Google účtem jako v aplikaci.</div>
    <button id="in">Přihlásit se Googlem</button>
    <div class="err" id="err"></div>
  </section>

  <section id="app" hidden>
    <form class="add" id="addForm">
      <input id="newTitle" placeholder="Nový úkol…" autocomplete="off">
      <button type="submit">Přidat</button>
    </form>
    <div id="list"></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyD2kcxgGXPwrfK-UQsvHeHYjfQyd4hhYcE",
  authDomain: "ukolywidget.firebaseapp.com",
  projectId: "ukolywidget",
});
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let tasks = [];
let ref = null;
let unsub = null;
let saveTimer = null;
let showDone = true;
let lastRemoteTs = 0;

// ID v aplikaci jsou 64bitová čísla, která JavaScript neumí přesně držet.
// Při čtení je proto převedeme na text a při zápisu zpět na číslo.
const parseTasks = text => JSON.parse(text.replace(/("id"\s*:\s*)(\d+)/g, '$1"$2"'));
const stringifyTasks = list => JSON.stringify(list).replace(/("id":)"(\d+)"/g, "$1$2");
const newId = () => BigInt.asUintN(62, BigInt(Math.floor(Math.random() * 2 ** 31)) << 31n
  | BigInt(Math.floor(Math.random() * 2 ** 31))).toString() || "1";

function setDone(t, done) {
  t.done = done;
  t.doneAt = done ? Date.now() : 0;
  t.subtasks.forEach(s => s.done = done);
}
function syncParent(t) {
  if (!t.subtasks.length) return;
  const all = t.subtasks.every(s => s.done);
  if (all && !t.done) { t.done = true; t.doneAt = Date.now(); }
  else if (!all && t.done) { t.done = false; t.doneAt = 0; }
}

function save() {
  setStatus("Ukládám…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      lastRemoteTs = Date.now();
      await setDoc(ref, { json: stringifyTasks(tasks), updatedAt: lastRemoteTs, device: "Web" });
      setStatus("☁ Zálohováno " + new Date().toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      setStatus("Uložení selhalo: " + e.message);
    }
  }, 400);
}
const setStatus = s => $("status").textContent = s;

function render() {
  const active = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);
  let html = "";
  active.forEach(t => html += card(t));
  if (done.length) {
    html += `<div class="doneh" data-act="toggleDone">Dokončeno (${done.length}) ${showDone ? "▴" : "▾"}</div>`;
    if (showDone) done.forEach(t => html += card(t));
  }
  if (!tasks.length) html = `<div class="empty">Zatím žádné úkoly.<br>Přidej první nahoře.</div>`;
  $("list").innerHTML = html;
}

function card(t) {
  const subs = t.subtasks.length;
  let h = `<div class="card ${t.done ? "done" : ""}" data-t="${t.id}">
    <div class="row">
      <button class="box ${t.done ? "on" : ""}" data-act="toggle" aria-label="Hotovo"></button>
      <input class="t main" data-act="title" value="${esc(t.title)}" placeholder="Název úkolu">
      ${subs ? `<span class="count">${t.subtasks.filter(s => s.done).length}/${subs}</span>
        <button class="arrow" data-act="expand" aria-label="Rozbalit">${t.expanded ? "▲" : "▼"}</button>` : ""}
      <button class="x" data-act="del" aria-label="Smazat">×</button>
    </div>`;
  if (t.expanded) {
    t.subtasks.forEach(s => {
      h += `<div class="row sub ${s.done ? "done" : ""}" data-s="${s.id}">
        <button class="box ${s.done ? "on" : ""}" data-act="toggleSub" aria-label="Hotovo"></button>
        <input class="t" data-act="subTitle" value="${esc(s.title)}">
        <button class="x" data-act="delSub" aria-label="Odebrat">×</button>
      </div>`;
    });
    if (!t.done) h += `<div class="addsub"><input data-act="addSub" placeholder="+ Přidat podúkol" autocomplete="off"></div>`;
  }
  return h + `</div>`;
}

const find = el => {
  const c = el.closest("[data-t]");
  const t = c && tasks.find(x => x.id === c.dataset.t);
  const r = el.closest("[data-s]");
  return { t, s: r && t && t.subtasks.find(x => x.id === r.dataset.s) };
};

$("list").addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "toggleDone") { showDone = !showDone; return render(); }
  const { t, s } = find(el);
  if (!t) return;
  if (act === "toggle") setDone(t, !t.done);
  else if (act === "expand") t.expanded = !t.expanded;
  else if (act === "toggleSub" && s) { s.done = !s.done; syncParent(t); }
  else if (act === "del") { if (!confirm("Smazat úkol?")) return; tasks = tasks.filter(x => x !== t); }
  else if (act === "delSub" && s) { t.subtasks = t.subtasks.filter(x => x !== s); syncParent(t); }
  else return;
  render(); save();
});

$("list").addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { t, s } = find(el);
  if (!t) return;
  if (el.dataset.act === "title") t.title = el.value.trim();
  else if (el.dataset.act === "subTitle" && s) s.title = el.value.trim();
  else return;
  save();
});

$("list").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const el = e.target;
  const { t } = find(el);
  if (!t) return;
  if (el.dataset.act === "addSub" && el.value.trim()) {
    t.subtasks.push({ id: newId(), title: el.value.trim(), done: false });
    syncParent(t);
    const id = t.id;
    render(); save();
    document.querySelector(`[data-t="${id}"] [data-act="addSub"]`)?.focus();
  } else if (el.matches("input.t")) {
    el.blur();
  }
});

$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const title = $("newTitle").value.trim();
  if (!title) return;
  tasks.unshift({ id: newId(), title, done: false, expanded: true, subtasks: [], created: Date.now(), doneAt: 0 });
  $("newTitle").value = "";
  render(); save();
});

function listen(uid) {
  ref = doc(db, "users", uid, "ukoly", "tasks");
  unsub = onSnapshot(ref, snap => {
    if (snap.metadata.hasPendingWrites) return;
    const data = snap.data();
    tasks = data && data.json ? parseTasks(data.json) : [];
    tasks.forEach(t => { t.subtasks ||= []; t.id = String(t.id); t.subtasks.forEach(s => s.id = String(s.id)); });
    const typing = document.activeElement && document.activeElement.matches("input.t, .addsub input");
    if (!typing) render();
    setStatus("☁ Synchronizováno");
  }, err => setStatus("Chyba načítání: " + err.message));
}

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  $("login").hidden = !!user;
  $("app").hidden = !user;
  $("who").hidden = !user;
  if (user) {
    $("email").textContent = user.email;
    setStatus("Načítám…");
    listen(user.uid);
  } else {
    tasks = [];
    setStatus("");
  }
});

$("in").onclick = async () => {
  $("err").textContent = "";
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $("err").textContent = "Přihlášení se nepovedlo: " + (e.code || e.message); }
};
$("out").onclick = () => signOut(auth);
</script>
</body>
</html>
